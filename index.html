<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="断链">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>断链 · 1V1 格斗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 冷硬、利落的武斗——像一册朱印拳谱
   IDEA: 一根铁链：连段是链，破链是断
   PICTURE: 画布上的整场对战；标题页是暮色断桥上的电脑自动对打
   COLOUR/TYPE: 墨 #141110 + 朱 #e8432b + 骨白 #efe9df；马善政毛笔字 / Noto Sans SC / Oswald 数字
   LAYOUT: 16:9 舞台按窗口等比缩放，各页面是叠在画布上的面板 */
:root{--ink:#141110;--ink2:#1f1a18;--red:#e8432b;--bone:#efe9df;--mute:#a39a8f;--line:rgba(239,233,223,.16);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0807;color:var(--bone);font:16px/1.5 "Noto Sans SC",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*16/9);aspect-ratio:16/9;container-type:size;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.page{position:absolute;inset:0;display:none;font-size:max(11px,1.25cqw)}
.page.on{display:flex}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.panel{margin:auto;width:min(94%,74em);max-height:92%;overflow:auto;background:rgba(20,17,16,.95);border-top:.35em solid var(--red);padding:1.4em 1.9em 1.3em;box-shadow:0 1em 3em #000a}
.panel.narrow{width:min(90%,30em)}
h2{font:400 2.5em/1.05 "Ma Shan Zheng","Noto Sans SC",serif;margin:0 0 .45em}
h2 small{font:500 .36em "Noto Sans SC",sans-serif;color:var(--mute);margin-left:.7em;vertical-align:middle}
h3{font-size:1.05em;margin:1em 0 .4em;color:var(--red)}
p{margin:.35em 0;color:#d9d1c6}
b{color:var(--bone)}
.actions{display:flex;gap:.7em;justify-content:flex-end;margin-top:1.1em;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line);padding:.5em 1.3em;min-height:2.6em;border-radius:.2em}
.btn:hover,.btn:focus-visible{border-color:var(--bone);background:rgba(239,233,223,.06)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:#f05a40}
/* 标题页 */
#PG_TITLE{align-items:stretch}
#PG_TITLE .band{width:38%;background:var(--red);color:var(--ink);padding:4% 3.6% 3.6%;display:flex;flex-direction:column;justify-content:flex-end}
#PG_TITLE .chainart{width:62%;margin-bottom:auto}
#PG_TITLE h1{font:400 12.5cqw/.92 "Ma Shan Zheng",serif;margin:0;color:var(--ink)}
#PG_TITLE .sub{font-weight:900;font-size:1.3em;margin:.7em 0 .3em}
#PG_TITLE .rule{font-size:.95em;color:#3b130d;max-width:24em;margin:0}
#PG_TITLE nav{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:5%;background:linear-gradient(90deg,rgba(10,8,7,.85),rgba(10,8,7,.1) 70%)}
.menu button{background:none;border:0;border-left:.22em solid transparent;text-align:left;padding:.4em 1em;font-size:1.65em;font-weight:500;width:fit-content;min-height:2em}
.menu button small{display:block;font-size:.5em;color:var(--mute);font-weight:400;line-height:1.3}
.menu button:hover,.menu button:focus-visible{border-left-color:var(--red);background:linear-gradient(90deg,rgba(232,67,43,.25),transparent);outline:none}
.menu.col{display:flex;flex-direction:column}
.ver{position:absolute;right:1.2em;bottom:.9em;color:var(--mute);font-size:.78em}
/* 选择页 */
.selrow{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:1em;align-items:center;margin:.65em 0}
.who{font:400 1.8em/1 "Ma Shan Zheng",serif;color:var(--red)}
.cards{display:flex;gap:.7em;flex-wrap:wrap}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em .8em;align-items:center;background:rgba(239,233,223,.04);border:1px solid var(--line);padding:.45em .9em .45em .45em;border-radius:.2em;text-align:left;flex:1 1 12em}
.card canvas{width:4.4em;height:5.4em;grid-row:span 3;display:block}
.card b{font:400 1.75em/1 "Ma Shan Zheng",serif}
.card .t{font-size:.82em;color:var(--mute)}
.card .st{font-size:.75em;color:var(--mute);display:flex;flex-wrap:wrap;gap:0 .7em}
.card .st i{font-style:normal;color:var(--bone)}
.card.stage canvas{width:8em;height:4.5em}
.card.small{flex:0 1 auto;padding:.5em 1em;grid-template-columns:1fr}
.card[aria-pressed=true]{border-color:var(--red);background:rgba(232,67,43,.15);box-shadow:inset 0 -.2em 0 var(--red)}
/* 表格页 */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2em}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88em}
th,td{padding:.32em .55em;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500}
td.w{white-space:normal;min-width:14em}
td code{font:600 .95em "Oswald","Noto Sans SC",sans-serif;color:var(--bone);letter-spacing:.02em}
.num{text-align:right;font-variant-numeric:tabular-nums}
kbd{font:600 .9em "Oswald",sans-serif;background:rgba(239,233,223,.1);border:1px solid var(--line);border-bottom-width:2px;padding:0 .45em;border-radius:.2em}
.tabs{display:flex;gap:.35em;flex-wrap:wrap;margin:.1em 0 .7em}
.tabs button{background:none;border:1px solid var(--line);padding:.25em .9em;border-radius:99em;font-size:.88em;min-height:2.2em}
.tabs button[aria-selected=true]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.dlbar{display:flex;height:2.6em;margin:.6em 0 .3em;border:1px solid var(--line)}
.dlbar div{display:flex;flex-direction:column;justify-content:center;padding:0 .5em;color:var(--ink);font-size:.8em;line-height:1.15;overflow:hidden}
.dlbar div b{color:inherit;font-size:1.15em}
/* 设置 */
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.55em 1.2em;align-items:center}
.set small{display:block;color:var(--mute);font-size:.8em}
.set select{background:var(--ink2);border:1px solid var(--line);padding:.3em .6em;min-height:2.3em;border-radius:.2em}
/* 对战页（触屏） */
#PG_BATTLE{pointer-events:none}
#touch{display:none}
#PG_BATTLE.touch #touch{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:44%;height:72%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:30%;top:62%;width:10.5em;height:10.5em;margin:-5.25em 0 0 -5.25em;pointer-events:none;--kx:0px;--ky:0px;opacity:.7;transition:opacity .15s}
#stick.on{opacity:1}
#stick .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(239,233,223,.4);background:radial-gradient(circle,rgba(20,17,16,.2) 0 37%,rgba(20,17,16,.6) 38%)}
#stick .ring i{position:absolute;font-style:normal;font-weight:700;font-size:.85em;line-height:1;color:rgba(239,233,223,.6)}
#stick .u{top:.55em;left:50%;transform:translateX(-50%)}#stick .d{bottom:.55em;left:50%;transform:translateX(-50%)}
#stick .l{left:.6em;top:50%;transform:translateY(-50%)}#stick .r{right:.6em;top:50%;transform:translateY(-50%)}
#stick .ring i.on{color:var(--red)}
#stick .knob{position:absolute;left:50%;top:50%;width:4.4em;height:4.4em;margin:-2.2em 0 0 -2.2em;border-radius:50%;background:rgba(239,233,223,.85);box-shadow:0 0 0 3px rgba(13,10,9,.55),0 .3em .8em rgba(0,0,0,.45);transform:translate(var(--kx),var(--ky))}
#touch .pad.r{position:absolute;right:2%;bottom:3%;width:17em;height:13em;pointer-events:none}
#touch .pad.r button{position:absolute;border-radius:50%;border:2px solid rgba(239,233,223,.4);background:rgba(20,17,16,.55);font-weight:700;touch-action:none;pointer-events:auto;padding:0}
#touch .pad.r button.on{background:rgba(232,67,43,.7);border-color:var(--bone)}
#touch .b-l{right:.4em;bottom:.4em;width:5.4em;height:5.4em}
#touch .b-h{right:7.1em;bottom:.9em;width:4.4em;height:4.4em}
#touch .b-s{right:.9em;bottom:7.1em;width:4.4em;height:4.4em}
#touch .b-brk{right:5.6em;bottom:5.6em;width:3.9em;height:3.9em;border-color:rgba(232,67,43,.85)!important;color:#ffb8a8}
#touch .b-fin{right:12em;bottom:1.3em;width:3.9em;height:3.9em}
#wrap:fullscreen{background:#0a0807}#wrap:-webkit-full-screen{background:#0a0807}
.hudbtn{position:absolute;top:2.4%;width:2.9cqw;height:2.9cqw;min-width:28px;min-height:28px;display:grid;place-items:center;padding:0;pointer-events:auto;background:rgba(13,10,9,.75);border:1px solid rgba(239,233,223,.3);border-radius:.25em;color:var(--bone)}
.hudbtn:hover{border-color:var(--bone)}.hudbtn svg{width:62%;height:62%}
#tPause{left:42.9%}#bFs{left:54.3%}
#fsTitle{position:absolute;top:1.1em;right:1.2em;display:flex;align-items:center;gap:.45em;background:rgba(13,10,9,.6);border:1px solid var(--line);border-radius:.25em;padding:.35em .9em;min-height:2.4em}
#fsTitle svg{width:1.1em;height:1.1em}#fsTitle:hover{border-color:var(--bone)}
[hidden]{display:none!important}
#toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:80%;background:rgba(13,10,9,.94);border:1px solid var(--red);padding:.6em 1.1em;border-radius:.25em;font-size:max(12px,1.2cqw);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#toast.on{opacity:1}
#rotate{display:none;position:fixed;inset:0;place-items:center;background:#0a0807;z-index:9;font-size:18px;text-align:center;padding:2em}
@media (orientation:portrait) and (max-width:820px) and (pointer:coarse){#rotate{display:grid}}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="wrap"><div id="app">
<canvas id="cv"></canvas>

<section class="page on" id="PG_TITLE">
  <div class="band">
    <svg class="chainart" viewBox="0 0 260 110" aria-hidden="true"><g fill="none" stroke="#141110" stroke-width="11" stroke-linecap="round"><rect x="10" y="30" width="96" height="50" rx="25"/><path d="M84 55h46"/><path d="M150 32h38a25 25 0 0 1 0 50h-38"/><path d="M136 38l-10-14M132 74l-12 12M222 30l16-16M228 86l18 10"/></g></svg>
    <h1>断链</h1>
    <div class="sub">1V1 无限连段格斗</div>
    <p class="rule">攻方可以一直连下去，伤害按阶段阈值“掉落”结算；守方攒满破链能量，就能把连段斩断。</p>
  </div>
  <nav class="menu">
    <button data-mode="cpu">对战电脑<small>1P 对 CPU</small></button>
    <button data-mode="pvp">双人对战<small>同一键盘 1P 对 2P</small></button>
    <button data-mode="train">训练模式<small>对木桩练连段与破链时机</small></button>
    <button data-go="PG_MOVES">招式与系统</button>
    <button data-go="PG_CODEX">设定 ID 表</button>
    <button data-go="PG_SETTINGS">设置</button>
  </nav>
  <div class="ver">v0.4 · 背景为电脑自动对战演示</div>
  <button id="fsTitle" data-fs aria-label="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d=""/></svg><span class="lbl">全屏</span></button>
</section>

<section class="page" id="PG_SELECT"><div class="panel">
  <h2>选择角色 <small id="selMode"></small></h2>
  <div class="selrow"><div class="who">1P</div><div class="cards" id="pickP1"></div></div>
  <div class="selrow"><div class="who" id="p2Who">CPU</div><div class="cards" id="pickP2"></div></div>
  <div class="selrow"><div class="who">场景</div><div class="cards" id="pickStage"></div></div>
  <div class="selrow" id="dummyRow"><div class="who">木桩</div><div class="cards" id="pickDummy"></div></div>
  <div class="actions"><button class="btn" data-go="PG_TITLE">返回</button><button class="btn primary" id="btnFight">开战</button></div>
</div></section>

<section class="page" id="PG_BATTLE">
  <div id="touch">
    <div id="stickZone"><div id="stick"><div class="ring"><i class="u">跳</i><i class="d">防</i><i class="l">◀</i><i class="r">▶</i></div><div class="knob"></div></div></div>
    <div class="pad r"><button data-k="fin" class="b-fin">终结</button><button data-k="brk" class="b-brk">破链</button><button data-k="s" class="b-s">特</button><button data-k="h" class="b-h">重</button><button data-k="l" class="b-l">轻</button></div>
  </div>
  <button class="hudbtn" id="tPause" aria-label="暂停"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M8.5 5v14M15.5 5v14"/></svg></button>
  <button class="hudbtn" id="bFs" data-fs aria-label="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d=""/></svg></button>
</section>

<section class="page" id="PG_PAUSE"><div class="panel narrow">
  <h2>暂停</h2>
  <nav class="menu col"><button id="btnResume">继续<small>Esc / P</small></button><button data-fs><span class="lbl">全屏</span><small>F 键</small></button><button data-go="PG_MOVES">招式与系统</button><button id="btnRestart">重新开始本场</button><button id="btnQuit">返回标题</button></nav>
</div></section>

<section class="page" id="PG_RESULT"><div class="panel narrow">
  <h2 id="resTitle"></h2><p id="resSub"></p>
  <div class="tablewrap"><table id="resTable"></table></div>
  <div class="actions"><button class="btn" id="btnToTitle">返回标题</button><button class="btn" id="btnReselect">重选角色</button><button class="btn primary" id="btnRematch">再战</button></div>
</div></section>

<section class="page" id="PG_MOVES"><div class="panel">
  <h2>招式与系统</h2>
  <div class="cols">
    <div id="sysText"></div>
    <div><h3>招式表</h3><div class="tabs" id="mvTabs"></div><div class="tablewrap"><table id="mvTable"></table></div>
      <h3>操作</h3><div class="tablewrap"><table id="keyTable"></table></div></div>
  </div>
  <div class="actions"><button class="btn" data-back>返回</button></div>
</div></section>

<section class="page" id="PG_CODEX"><div class="panel">
  <h2>设定 ID 表 <small>由代码里的数据表直接生成，改数据后这里自动同步</small></h2>
  <div class="tabs" id="cxTabs"></div>
  <p id="cxNote"></p>
  <div class="tablewrap"><table id="cxTable"></table></div>
  <div class="actions"><button class="btn" data-back>返回</button></div>
</div></section>

<section class="page" id="PG_SETTINGS"><div class="panel narrow">
  <h2>设置</h2>
  <div class="set" id="setList"></div>
  <div class="actions"><button class="btn" id="setReset">恢复默认</button><button class="btn primary" data-back>完成</button></div>
</div></section>
<div id="toast" role="status"></div>
</div>
<div id="rotate">请把设备横过来游玩</div></div>

<script>
{
'use strict';
/* ============================================================
   《断链》1V1 无限连段格斗 —— 原型
   所有可调内容都在下面的数据表里（CFG / DROP_LEVELS / CHARS / …）
   ============================================================ */
const W = 1280, H = 720;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const rand = (a, b) => a + Math.random() * (b - a), randi = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const FB = '"Ma Shan Zheng","Noto Sans SC",serif', FN = '"Oswald","Noto Sans SC",sans-serif', FU = '"Noto Sans SC",system-ui,sans-serif';
const INK = '#0d0a09', BONE = '#efe9df', RED = '#e8432b', MUTE = '#a39a8f';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOUCH = matchMedia('(pointer: coarse)').matches;

/* ---------- 一、全局参数 CFG（帧 = 1/60 秒） ---------- */
const CFG = {
  HP: 1600, ROUND_TIME: 99, ROUNDS_TO_WIN: 2,
  GROUND: 620, WALL_L: 70, WALL_R: 1210, GRAVITY: 0.95, BUFFER: 8,
  BRK_MAX: 100, BRK_COST: 100, BRK_START: 20,
  GAIN: { guard: 6, landHit: 2, commit: 10, passive: 0.02 },
  CHAIN_WINDOW: 40, WINDOW_MUL: 1, CHAIN_DIST: 100,
  REPEAT_LIMIT: 3, REPEAT_MOM_MUL: 0.5, REPEAT_DMG_MUL: 0.7,
  IMMEDIATE_RATIO: 0.3, FIN_MIN_LV: 3, COUNTER_MOM: 20,
  END_PROTECT: 10, FIN_DOWN: 100,
  GRD_REGEN: 0.35, GRD_CRUSH_STUN: 46,
  SHARDS: true, SHARD_INTERVAL: 540, SHARD_VALUE: 25, SHARD_LIFE: 600,
  BREAK_STAGGER: 50, BREAK_INV: 30, BREAK_PUSH: 16,
  AI_LEVEL: 1, SHAKE: !REDUCED, SOUND: true, VIBRATE: true, STICK_MODE: 'float',
};
const CFG_DESC = {
  HP: '生命值上限', ROUND_TIME: '每回合秒数（0 = 不限时）', ROUNDS_TO_WIN: '获胜所需回合数',
  GROUND: '地面高度（像素）', WALL_L: '左墙', WALL_R: '右墙', GRAVITY: '重力', BUFFER: '按键预输入缓存（帧）',
  BRK_MAX: '破链能量上限', BRK_COST: '破链一次消耗的能量', BRK_START: '每回合开局的破链能量',
  GAIN: '其他充能：防御成功 / 命中对手 / 每次掉落结算（守方）/ 每帧自然增长',
  CHAIN_WINDOW: '连段窗口（帧）：上一击命中后，下一击必须在这段时间内命中', WINDOW_MUL: '连段窗口倍率（设置页）', CHAIN_DIST: '连段中守方被锁定在攻方前方的距离',
  REPEAT_LIMIT: '同一招连续命中达到此次数，连段中断', REPEAT_MOM_MUL: '重复招式的连段势倍率', REPEAT_DMG_MUL: '重复招式的伤害倍率',
  IMMEDIATE_RATIO: '每击立即生效的伤害比例，其余进入暂存', FIN_MIN_LV: '可用终结技的最低掉落阶段', COUNTER_MOM: '反击起手（打断对手出招）额外的连段势',
  END_PROTECT: '连段结束后守方额外的无敌帧（防止立刻再起手）', FIN_DOWN: '吃到终结技后的倒地帧数',
  GRD_REGEN: '护架每帧恢复量', GRD_CRUSH_STUN: '破防硬直（帧）',

/* ---------- 音效（WebAudio 合成，无外部文件） ---------- */
const SFX = {
  c: null,
  init() {
    if (this.c) { if (this.c.state === 'suspended') this.c.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; this.c = new C();
      this.m = this.c.createGain(); this.m.gain.value = .45; this.m.connect(this.c.destination);
      const n = this.c.sampleRate; this.nb = this.c.createBuffer(1, n, n); const d = this.nb.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.c = null; }
  },
  noise(t, dur, type, freq, vol, q = 1) {
    const s = this.c.createBufferSource(), f = this.c.createBiquadFilter(), g = this.c.createGain();
    s.buffer = this.nb; f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.m); s.start(t); s.stop(t + dur + .05);
  },
  tone(t, f0, f1, dur, type, vol) {
    const o = this.c.createOscillator(), g = this.c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(this.m); o.start(t); o.stop(t + dur + .05);
  },
  play(k, p = 0) {
    if (!CFG.SOUND || !this.c || G.demo) return;
    const t = this.c.currentTime;
    switch (k) {
      case 'swing': this.noise(t, .08, 'bandpass', 900 + p * 8, .1, 1.3); break;
      case 'hit': this.tone(t, 170, 46, .16, 'sine', .45 + Math.min(.4, p / 200)); this.noise(t, .07, 'lowpass', 2400, .32); break;
      case 'block': this.tone(t, 1100, 700, .05, 'square', .07); this.noise(t, .05, 'highpass', 3000, .16); break;
      case 'commit': this.tone(t, 92, 34, .6, 'sine', .7); [0, 4, 7].forEach((s, i) => { const f = 196 * Math.pow(2, (s + p * 2) / 12); this.tone(t + .02 * i, f, f, .7, 'triangle', .07); }); this.noise(t, .25, 'lowpass', 900, .28); break;
      case 'break': this.noise(t, .7, 'highpass', 2800, .42); this.tone(t, 1500, 180, .5, 'sawtooth', .07); this.tone(t, 80, 30, .7, 'sine', .7); break;
      case 'finish': this.tone(t, 120, 28, 1, 'sine', .9); this.noise(t, .5, 'lowpass', 1400, .5); this.tone(t + .05, 330, 110, .8, 'triangle', .11); break;
      case 'shard': this.tone(t, 880, 880, .25, 'sine', .14); this.tone(t + .06, 1320, 1320, .3, 'sine', .11); break;
      case 'crush': this.noise(t, .3, 'bandpass', 600, .5, 2); this.tone(t, 200, 60, .3, 'square', .13); break;
      case 'ko': this.tone(t, 70, 25, 1.6, 'sine', .9); this.noise(t, 1, 'lowpass', 600, .4); break;
      case 'round': this.tone(t, 196, 196, 1.2, 'triangle', .16); this.tone(t, 294, 294, 1.2, 'triangle', .1); break;
      case 'ui': this.tone(t, 660, 660, .05, 'square', .04); break;
    }
  },
