<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0807">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>断链 · 1V1 格斗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 冷硬、利落的武斗——像一册朱印拳谱
   IDEA: 一根铁链：连段是链，破链是断
   PICTURE: 画布上的整场对战；标题页是暮色断桥上的电脑自动对打
   COLOUR/TYPE: 墨 #141110 + 朱 #e8432b + 骨白 #efe9df；马善政毛笔字 / Noto Sans SC / Oswald 数字
   LAYOUT: 16:9 舞台按窗口等比缩放，各页面是叠在画布上的面板 */
:root{--ink:#141110;--ink2:#1f1a18;--red:#e8432b;--bone:#efe9df;--mute:#a39a8f;--line:rgba(239,233,223,.16);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0807;color:var(--bone);font:16px/1.5 "Noto Sans SC",system-ui,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{position:relative;width:min(100vw - env(safe-area-inset-left) - env(safe-area-inset-right),(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*16/9);aspect-ratio:16/9;container-type:size;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.page{position:absolute;inset:0;display:none;font-size:max(11px,1.25cqw)}
.page.on{display:flex}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.panel{margin:auto;width:min(94%,74em);max-height:92%;overflow:auto;background:rgba(20,17,16,.95);border-top:.35em solid var(--red);padding:1.4em 1.9em 1.3em;box-shadow:0 1em 3em #000a}
.panel.narrow{width:min(90%,30em)}
h2{font:400 2.5em/1.05 "Ma Shan Zheng","Noto Sans SC",serif;margin:0 0 .45em}
h2 small{font:500 .36em "Noto Sans SC",sans-serif;color:var(--mute);margin-left:.7em;vertical-align:middle}
h3{font-size:1.05em;margin:1em 0 .4em;color:var(--red)}
p{margin:.35em 0;color:#d9d1c6}
b{color:var(--bone)}
.actions{display:flex;gap:.7em;justify-content:flex-end;margin-top:1.1em;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line);padding:.5em 1.3em;min-height:2.6em;border-radius:.2em}
.btn:hover,.btn:focus-visible{border-color:var(--bone);background:rgba(239,233,223,.06)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{background:#f05a40}
/* 标题页 */
#PG_TITLE{align-items:stretch}
#PG_TITLE .band{width:38%;background:var(--red);color:var(--ink);padding:4% 3.6% 3.6%;display:flex;flex-direction:column;justify-content:flex-end}
#PG_TITLE .chainart{width:62%;margin-bottom:auto}
#PG_TITLE h1{font:400 12.5cqw/.92 "Ma Shan Zheng",serif;margin:0;color:var(--ink)}
#PG_TITLE .sub{font-weight:900;font-size:1.3em;margin:.7em 0 .3em}
#PG_TITLE .rule{font-size:.95em;color:#3b130d;max-width:24em;margin:0}
#PG_TITLE nav{flex:1;display:flex;flex-direction:column;justify-content:center;padding-left:5%;background:linear-gradient(90deg,rgba(10,8,7,.85),rgba(10,8,7,.1) 70%)}
.menu button{background:none;border:0;border-left:.22em solid transparent;text-align:left;padding:.4em 1em;font-size:1.65em;font-weight:500;width:fit-content;min-height:2em}
.menu button small{display:block;font-size:.5em;color:var(--mute);font-weight:400;line-height:1.3}
.menu button:hover,.menu button:focus-visible{border-left-color:var(--red);background:linear-gradient(90deg,rgba(232,67,43,.25),transparent);outline:none}
.menu.col{display:flex;flex-direction:column}
.ver{position:absolute;right:1.2em;bottom:.9em;color:var(--mute);font-size:.78em}
/* 选择页 */
.selrow{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:1em;align-items:center;margin:.65em 0}
.who{font:400 1.8em/1 "Ma Shan Zheng",serif;color:var(--red)}
.cards{display:flex;gap:.7em;flex-wrap:wrap}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.1em .8em;align-items:center;background:rgba(239,233,223,.04);border:1px solid var(--line);padding:.45em .9em .45em .45em;border-radius:.2em;text-align:left;flex:1 1 12em}
.card canvas{width:4.4em;height:5.4em;grid-row:span 3;display:block}
.card b{font:400 1.75em/1 "Ma Shan Zheng",serif}
.card .t{font-size:.82em;color:var(--mute)}
.card .st{font-size:.75em;color:var(--mute);display:flex;flex-wrap:wrap;gap:0 .7em}
.card .st i{font-style:normal;color:var(--bone)}
.card.stage canvas{width:8em;height:4.5em}
.card.small{flex:0 1 auto;padding:.5em 1em;grid-template-columns:1fr}
.card[aria-pressed=true]{border-color:var(--red);background:rgba(232,67,43,.15);box-shadow:inset 0 -.2em 0 var(--red)}
/* 表格页 */
.cols{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:2em}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88em}
th,td{padding:.32em .55em;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:500}
td.w{white-space:normal;min-width:14em}
td code{font:600 .95em "Oswald","Noto Sans SC",sans-serif;color:var(--bone);letter-spacing:.02em}
.num{text-align:right;font-variant-numeric:tabular-nums}
kbd{font:600 .9em "Oswald",sans-serif;background:rgba(239,233,223,.1);border:1px solid var(--line);border-bottom-width:2px;padding:0 .45em;border-radius:.2em}
.tabs{display:flex;gap:.35em;flex-wrap:wrap;margin:.1em 0 .7em}
.tabs button{background:none;border:1px solid var(--line);padding:.25em .9em;border-radius:99em;font-size:.88em;min-height:2.2em}
.tabs button[aria-selected=true]{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.dlbar{display:flex;height:2.6em;margin:.6em 0 .3em;border:1px solid var(--line)}
.dlbar div{display:flex;flex-direction:column;justify-content:center;padding:0 .5em;color:var(--ink);font-size:.8em;line-height:1.15;overflow:hidden}
.dlbar div b{color:inherit;font-size:1.15em}
/* 设置 */
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.55em 1.2em;align-items:center}
.set small{display:block;color:var(--mute);font-size:.8em}
.set select{background:var(--ink2);border:1px solid var(--line);padding:.3em .6em;min-height:2.3em;border-radius:.2em}
/* 对战页（触屏） */
#PG_BATTLE{pointer-events:none}
#touch{display:none;position:absolute;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);pointer-events:none;z-index:3;font-size:clamp(9px,2.9vmin,15px);color:var(--bone)}
#wrap.battle #touch{display:block}
#stickZone{position:absolute;left:0;bottom:0;width:46%;height:78%;pointer-events:auto;touch-action:none}
#stick{position:absolute;left:0;top:0;width:10em;height:10em;margin:-5em 0 0 -5em;pointer-events:none;--kx:0px;--ky:0px;opacity:.6;transition:opacity .18s}
#stick.on{opacity:1}
#stick.thru:not(.on){opacity:.2}
#stick .ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(239,233,223,.42);background:radial-gradient(circle,rgba(20,17,16,.06) 0 37%,rgba(20,17,16,.26) 38%)}
#stick .ring i{position:absolute;font-style:normal;font-weight:700;font-size:.85em;line-height:1;color:rgba(239,233,223,.7);text-shadow:0 1px 3px #000}
#stick .u{top:.55em;left:50%;transform:translateX(-50%)}#stick .d{bottom:.55em;left:50%;transform:translateX(-50%)}
#stick .l{left:.6em;top:50%;transform:translateY(-50%)}#stick .r{right:.6em;top:50%;transform:translateY(-50%)}
#stick .ring i.on{color:var(--red)}
#stick .knob{position:absolute;left:50%;top:50%;width:3.9em;height:3.9em;margin:-1.95em 0 0 -1.95em;border-radius:50%;background:rgba(239,233,223,.78);box-shadow:0 0 0 3px rgba(13,10,9,.45),0 .3em .8em rgba(0,0,0,.4);transform:translate(var(--kx),var(--ky))}
#touch .pad.r{position:absolute;right:0;bottom:0;width:15.2em;height:14.6em;pointer-events:none}
#touch .pad.r button{position:absolute;border-radius:50%;border:2px solid rgba(239,233,223,.45);background:rgba(20,17,16,.28);color:var(--bone);font-size:1em;font-weight:700;text-shadow:0 1px 3px #000;touch-action:none;pointer-events:auto;padding:0;opacity:.9;transition:opacity .18s}
#touch .pad.r button.on{background:rgba(232,67,43,.7);border-color:var(--bone);opacity:1}
#touch .pad.r button.thru:not(.on){opacity:.2}
#touch .pad.r button .ic{position:absolute;left:17%;top:10%;width:66%;height:66%;pointer-events:none}
#touch .pad.r button b{position:absolute;left:0;right:0;bottom:9%;font-size:.62em;line-height:1;letter-spacing:.04em;pointer-events:none;text-shadow:0 1px 2px #000,0 0 3px #000}
#touch .pad.r button i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:1.25em;pointer-events:none;text-shadow:0 1px 3px #000}
#touch .pad.r button::after{content:'';position:absolute;inset:-2px;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(13,10,9,.68) calc(var(--cd,0) * 1turn),transparent 0)}
#touch .pad.r button.b-brk::after{inset:-5px;background:conic-gradient(var(--red) calc(var(--bk,0) * 1turn),rgba(239,233,223,.12) 0);-webkit-mask:radial-gradient(circle,transparent 64%,#000 65%);mask:radial-gradient(circle,transparent 64%,#000 65%)}
#touch .pad.r button.rdy{box-shadow:0 0 0 2px var(--rc,#efe9df),0 0 .9em var(--rc,#efe9df);opacity:1}
#touch .pad.r button.hot{animation:hot .5s ease-in-out infinite alternate}
@keyframes hot{to{box-shadow:0 0 0 3px var(--rc),0 0 1.6em var(--rc);transform:scale(1.07)}}
#touch .pad.r button.off{filter:grayscale(.9);opacity:.42}
.ic{width:1.6em;height:1.6em;vertical-align:middle;flex:none}
.chip .ic{width:1.55em;height:1.55em;margin:-.25em .3em -.2em -.5em}
.chip{display:inline-flex;align-items:center}
.detail .mech .ic{width:1.5em;height:1.5em;margin:-.2em .25em 0 0}
.mvn{white-space:nowrap}.mvn .ic{width:1.9em;height:1.9em;margin:-.3em .45em -.25em 0}
#cxTable code .ic{width:1.7em;height:1.7em;margin:-.3em .45em -.25em 0}
#sysText .ic{width:1.45em;height:1.45em;margin:-.2em .3em 0 0}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2em,1fr));gap:.6em;padding:.3em 0}
.icgrid figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:.3em;padding:.6em .3em;background:rgba(239,233,223,.04);border-radius:.6em}
.icgrid .ic{width:3.4em;height:3.4em}.icgrid figcaption{font-size:.72em;text-align:center;line-height:1.35}.icgrid code{font-size:.9em;color:var(--mute)}
#touch .b-l{right:.6em;bottom:.6em;width:5.2em;height:5.2em}
#touch .b-h{right:7.05em;bottom:1.05em;width:4.3em;height:4.3em}
#touch .b-fin{right:11.45em;bottom:2.77em;width:3.7em;height:3.7em}
#touch .b-s{right:1.05em;bottom:7.05em;width:4.3em;height:4.3em}
#touch .b-jump{right:5.44em;bottom:5.44em;width:4em;height:4em;border-color:rgba(159,211,208,.9)!important}
#touch .b-brk{right:9.39em;bottom:7.63em;width:3.7em;height:3.7em;border-color:rgba(232,67,43,.85)!important;color:#ffb8a8}
#touch .b-ast{right:5.17em;bottom:10.81em;width:3.7em;height:3.7em;border-color:rgba(214,164,74,.9)!important;color:#ffe2a8}
#wrap:fullscreen{background:#0a0807}#wrap:-webkit-full-screen{background:#0a0807}
.hudbtn{position:absolute;top:2.4%;width:2.9cqw;height:2.9cqw;min-width:28px;min-height:28px;display:grid;place-items:center;padding:0;pointer-events:auto;background:rgba(13,10,9,.75);border:1px solid rgba(239,233,223,.3);border-radius:.25em;color:var(--bone)}
.hudbtn:hover{border-color:var(--bone)}.hudbtn svg{width:62%;height:62%}
#tPause{left:42.9%}#bFs{left:54.3%}
#titleTools{position:absolute;top:1.1em;right:1.2em;display:flex;gap:.6em}
#accChip{display:flex;align-items:center;gap:.5em;background:rgba(13,10,9,.6);border:1px solid var(--line);border-radius:.25em;padding:.3em .9em .3em .4em;min-height:2.4em;max-width:14em}
#accChip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#accChip svg{width:1.2em;height:1.2em;margin-left:.4em}#accChip:hover{border-color:var(--bone)}
.av{display:inline-grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--c);color:#fff;font:400 1em/1 "Ma Shan Zheng",serif;flex:none;box-shadow:inset 0 0 0 2px rgba(13,10,9,.35)}
.av.sm{width:1.35em;height:1.35em;font-size:.9em;margin-right:.35em;vertical-align:-.3em}.av.lg{width:3.2em;height:3.2em;font-size:1.7em}
.form{display:grid;gap:.6em;max-width:34em}.form label{display:grid;grid-template-columns:4.2em minmax(0,1fr);align-items:center;gap:.8em}.form label span{color:var(--mute)}
.form input,.join input{font:inherit;color:var(--bone);background:rgba(239,233,223,.06);border:1px solid var(--line);border-radius:.2em;padding:.5em .7em;min-height:2.5em;min-width:0;user-select:text;-webkit-user-select:text}
.form input:focus,.join input:focus{outline:2px solid var(--red);outline-offset:0;border-color:transparent}
.err{color:#ff8f7a;min-height:1.2em;margin:0}.hint{color:var(--mute);font-size:.88em}.mute{color:var(--mute);font-weight:400;font-size:.85em}
.prof{display:flex;align-items:center;gap:1em;flex-wrap:wrap;padding:.4em 0 .2em}.pinfo{display:grid;gap:.1em;flex:1;min-width:12em}.pnick{font-size:1.5em}
.ptitle{display:inline-block;margin-left:.5em;font-size:.78em;color:#fff;background:var(--red);padding:.05em .55em;border-radius:99em;vertical-align:.25em}.pinfo small,.prow small{color:var(--mute)}.pinfo .ptitle,.prow .ptitle,.ibox .ptitle{justify-self:start;width:fit-content;margin:.1em 0}.pbtn{display:flex;gap:.5em}
.statgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45em}.statgrid div{background:rgba(239,233,223,.05);border:1px solid var(--line);padding:.45em .7em;display:grid}.statgrid b{font:600 1.45em/1.2 "Oswald","Noto Sans SC",sans-serif}.statgrid small{color:var(--mute);font-size:.8em}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.3em}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr));gap:.4em}.ach{display:grid;grid-template-columns:2.4em minmax(0,1fr);grid-template-rows:auto auto;column-gap:.5em;align-items:center;padding:.35em .5em;border:1px solid var(--line);opacity:.5}
.ach.on{opacity:1;border-color:rgba(232,67,43,.55);background:rgba(232,67,43,.07)}.ach .ic{grid-row:span 2;width:2.4em;height:2.4em}.ach b{font-size:.92em}.ach small{color:var(--mute);font-size:.75em;line-height:1.3}
.res{display:inline-block;width:1.7em;text-align:center;font-weight:700;border-radius:.2em}.res.w{background:var(--red);color:#fff}.res.l{background:#3a3330}.res.d{background:#5a524b}
.onact{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}.join{display:flex;gap:.4em}.join input{width:7em;text-align:center;letter-spacing:.2em}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(17em,1fr));gap:.45em}.prow{display:flex;align-items:center;gap:.7em;border:1px solid var(--line);padding:.45em .6em;background:rgba(239,233,223,.03)}.prow>div{flex:1;display:grid;min-width:0}.prow .btn{min-height:2.2em;padding:.3em .9em}
.badge{display:inline-block;min-width:1.4em;padding:0 .4em;margin-left:.45em;border-radius:99em;background:var(--red);color:#fff;font:700 .7em/1.5 "Oswald",sans-serif;text-align:center;vertical-align:.35em;font-style:normal}
.pbtns{display:flex;gap:.35em;flex-wrap:wrap;justify-content:flex-end}.btn.ghost{background:none;border-color:transparent;color:var(--mute)}.btn.ghost:hover{color:var(--bone);border-color:var(--line)}
.dot{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:#5a524b;margin-right:.35em;vertical-align:.05em}.dot.on{background:#3fbf6f;box-shadow:0 0 .4em #3fbf6f}.plist.small{grid-template-columns:repeat(auto-fill,minmax(14em,1fr))}.hint.err{color:#f2b09a}.ontabs{margin-bottom:.9em}
#frName{width:11em;text-align:left;letter-spacing:0}.plist.fr{grid-template-columns:repeat(auto-fill,minmax(23em,1fr))}.prow small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rdy{font-style:normal;font-size:.75em;color:#fff;background:#2f8f5b;padding:.05em .5em;border-radius:99em;margin-left:.5em}.code{font:600 1.3em "Oswald",sans-serif;color:var(--red);letter-spacing:.12em}
.btn:disabled,.chip:disabled,.pc:disabled,.card:disabled{opacity:.45;cursor:default}
#modal{position:absolute;inset:0;z-index:30;background:rgba(10,8,7,.72);display:grid;place-items:center;font-size:max(12px,1.35cqw)}#modal[hidden]{display:none}

@media(max-width:700px){.statgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.cols2{grid-template-columns:1fr}}
#dlTitle{display:flex;align-items:center;gap:.45em;background:rgba(232,67,43,.85);border:1px solid var(--red);border-radius:.25em;padding:.35em .9em;min-height:2.4em;color:#fff;text-decoration:none;font-weight:700}
#dlTitle svg{width:1.1em;height:1.1em}#dlTitle:hover{border-color:var(--bone)}
.mvd{font-size:.86em;color:var(--mute);min-width:13em;line-height:1.45}

@keyframes updPulse{50%{box-shadow:0 0 0 .35em rgba(232,67,43,.25)}}
#fsTitle{display:flex;align-items:center;gap:.45em;background:rgba(13,10,9,.6);border:1px solid var(--line);border-radius:.25em;padding:.35em .9em;min-height:2.4em}
#fsTitle svg{width:1.1em;height:1.1em}#fsTitle:hover{border-color:var(--bone)}
[hidden]{display:none!important}

<script>

'use strict';
/* ============================================================

const W = 1280, H = 720;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const grand = (a, b) => a + (G.rng ? G.rng() : Math.random()) * (b - a);   // 影响胜负的随机数（联机双方同种子）
const rand = (a, b) => a + Math.random() * (b - a), randi = (a, b) => Math.floor(rand(a, b + 1)), pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;

const TOUCH = matchMedia('(pointer: coarse)').matches;

/* ---------- 一、全局参数 CFG（帧 = 1/60 秒） ---------- */
const CFG = {

  const nums = []; let out = '';
  for (const tok of path.match(/[MLCQZ]|-?\d*\.?\d+/g)) {
    if (/[MLCQZ]/.test(tok)) { out += tok; continue; }
    nums.push(+tok);

/* ============================================================

   ============================================================ */
const SUPA = { URL: '', KEY: '', ...(window.DUANLIAN_SUPA || {}) };

const ERR_CN = [[/Invalid login credentials/i, '账号名或密码不对'], [/already registered|already been registered|already exists/i, '这个账号名已经被注册了'],

async function accInit() {
  if (!SUPA.URL || !SUPA.KEY) { ACC.state = 'off'; recLoad(); accUI(); return; }
  ACC.state = 'loading'; recLoad(); accUI();
  try {
    const lib = await loadSupabase();
    ACC.sb = lib.createClient(SUPA.URL, SUPA.KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'duanlian.auth' }, realtime: { params: { eventsPerSecond: 50 } } });
    const { data } = await ACC.sb.auth.getSession();
    await accSetUser(data && data.session ? data.session.user : null);
    ACC.sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'SIGNED_OUT') accSetUser(null);
      else if (session && session.user && (!ACC.user || ACC.user.id !== session.user.id)) accSetUser(session.user);
    });
  } catch (e) { ACC.state = 'err'; ACC.err = '连不上账户服务器，请检查网络后重试'; accUI(); }
}

  if (!user) { ACC.state = ACC.sb ? 'out' : ACC.state; recLoad(); accUI(); netLeaveAll(); return; }
  recLoad();
  try {
    let { data, error } = await ACC.sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    if (error) throw error;
    if (!data) {   // 没有触发器时自己补一条资料
      const m = user.user_metadata || {};
      const row = { id: user.id, username: m.username || user.email.split('@')[0], nickname: m.nickname || m.username || '无名', avatar: m.avatar || 'CH_JIN' };

/* ---------- 战绩与成就：本地缓存 + 云端同步（取较大值合并） ---------- */
const STAT0 = () => ({ games: 0, wins: 0, losses: 0, draws: 0, chars: {}, maxHits: 0, maxLv: 0, fins: 0, breaks: 0, parries: 0, burns: 0, chases: 0, bounces: 0, sides: 0, throws: 0, perfects: 0, onG: 0, onW: 0, cpu2: 0 });

  clearTimeout(pushT);

    .on('broadcast', { event: 'frd' }, ({ payload: p }) => { if (p.to === uid) frLoad(); })
    .subscribe(st => { if (st === 'SUBSCRIBED') lobbyTrack(); else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { $('#onState') && ($('#onState').textContent = '连接大厅失败，请检查网络'); } });
}

function lobbyMatch() {

  const i = q.findIndex(m => m.uid === ACC.user.id);
  if (i < 0 || i % 2 || !q[i + 1]) return;
  const code = String(1000 + Math.floor(Math.random() * 9000)); NET.matching = true;

/* ---------- 房间 ---------- */
function roomJoin(code, host, spar) {
  if (ACC.state !== 'in') { go('PG_ACCOUNT'); return Promise.resolve(false); }
  roomLeave(true);
  lobbyJoin();
  Object.assign(ROOM, { code, host, peer: null, ready: [false, false], rtt: [], joinedAt: Date.now(), spar: !!spar, rounds: CFG.ROUNDS_TO_WIN });
  const uid = ACC.user.id;
  return new Promise(resolve => {
    let done = false; const finish = ok => { if (!done) { done = true; resolve(ok); } };
    const ch = ACC.sb.channel('duanlian-room-' + code, { config: { presence: { key: uid }, broadcast: { self: false, ack: false } } });
    ROOM.ch = ch;
    ch.on('presence', { event: 'sync' }, () => roomPresence())
      .on('broadcast', { event: 'm' }, ({ payload }) => roomMsg(payload))
      .on('broadcast', { event: 'in' }, ({ payload }) => lsRecv(payload))
      .subscribe(async st => {
        if (st === 'SUBSCRIBED') {
          await ch.track({ ...myInfo(), host, t: ROOM.joinedAt });
          lobbySetStatus('room'); G.mode = 'online';
          if (host) { G.sel.p1 = G.sel.p1 || 'CH_JIN'; } else { G.sel.p2 = G.sel.p2 || 'CH_LAN'; }
          go('PG_SELECT'); finish(true);
          if (!host) setTimeout(() => { if (ROOM.ch === ch && !ROOM.peer) { toast(`没找到房间 ${code}，请确认房间号`); roomLeave(); go('PG_ONLINE'); } }, 6000);
        } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') { toast('连接房间失败，请检查网络'); roomLeave(); finish(false); }
      });
    clearInterval(ROOM.pingT);
    ROOM.pingT = setInterval(() => { if (ROOM.peer && !LS.on) roomSend('ping', { t: performance.now() }); }, 2000);
  });
}
function roomSend(k, d = {}) { if (ROOM.ch) ROOM.ch.send({ type: 'broadcast', event: 'm', payload: { k, ...d } }).catch(() => {}); }
function roomPresence() {
  if (!ROOM.ch) return;
  const uid = ACC.user.id, list = Object.values(ROOM.ch.presenceState()).map(a => a[a.length - 1]).filter(m => m && m.uid);
  const hostM = list.find(m => m.host && m.uid !== uid), guests = list.filter(m => !m.host).sort((a, b) => a.t - b.t || (a.uid < b.uid ? -1 : 1));
  let peer = null;
  if (ROOM.host) peer = guests[0] || null;
  else {
    if (guests.length > 1 && guests[0].uid !== uid && guests.some(g => g.uid === uid)) { toast('房间已满'); roomLeave(); go('PG_ONLINE'); return; }
    peer = hostM || null;
  }
  if (peer && (!ROOM.peer || ROOM.peer.uid !== peer.uid)) {
    ROOM.peer = peer; ROOM.ready = [false, false]; NET.pending = null;
    if (ROOM.host) roomSend('sel', { sel: { p1: G.sel.p1, g1: G.sel.g1, a1: G.sel.a1, stage: G.sel.stage }, spar: ROOM.spar, rounds: ROOM.rounds });

  if (LS.on) { toast(`${name} 断线了，本场判你获胜`); lsForfeit(); return; }
  if (G.mode !== 'online') return;

const mySlots = () => ROOM.host ? ['p1', 'g1', 'a1', 'stage'] : ['p2', 'g2', 'a2'];
function roomMsg(m) {
  if (!m || !m.k) return;
  if (m.k === 'sel') { const ok = ROOM.host ? ['p2', 'g2', 'a2'] : ['p1', 'g1', 'a1', 'stage']; for (const k of ok) if (m.sel[k]) G.sel[k] = m.sel[k]; if (!ROOM.host && 'spar' in m) { ROOM.spar = !!m.spar; ROOM.rounds = m.rounds || ROOM.rounds; } ROOM.ready[ROOM.host ? 1 : 0] = false; if (G.page === 'PG_SELECT' && G.mode === 'online') buildSelect(); }

  else if (m.k === 'quit' && LS.on) { toast(`${ROOM.peer ? ROOM.peer.nick : '对手'} 认输离开了`); lsForfeit(); }
  else if (m.k === 'timeout' && LS.on) { const me = G.f[LS.me], op = G.f[1 - LS.me]; op.wins = Math.max(op.wins, me.wins + 1); G.rs = 'RS_KO'; toast('你断开太久，本场判负'); endMatch(); }

const roomTitle = () => `${ROOM.spar ? `好友切磋 · ${['', '一局定胜负', '三局两胜', '五局三胜'][ROOM.rounds] || ''}` : '联机'} · 房间 ${ROOM.code}${ROOM.rtt.length ? ` · 延迟 ${Math.round(median(ROOM.rtt))} ms` : ''}`;

function roomMaybeStart() {

function lsStart(m) {

  LS = { on: true, me: ROOM.host ? 0 : 1, peer: ROOM.peer, D: m.D, frame: 0, loc: new Map(), rem: new Map(), remTop: m.D - 1, ack: -1, tick: 0, wait: 0, hash: new Map(), remHash: new Map(), desync: false, cfgBak: { ...CFG } };
  for (let f = 0; f < m.D; f++) { LS.loc.set(f, 0); LS.rem.set(f, 0); }

  const s = m.sel; G.frame = 0;
  startMatch({ mode: 'online', p1: s.p1, p2: s.p2, g1: s.g1, g2: s.g2, a1: s.a1, a2: s.a2, stage: s.stage });

function lsStop() { if (!LS.on) return; LS.on = false; if (LS.cfgBak) { const keep = {}; for (const k of NET_CFG_SKIP) keep[k] = CFG[k]; Object.assign(CFG, LS.cfgBak, keep); } }
function lsForfeit() {
  if (!LS.on) return; const me = G.f[LS.me], op = G.f[1 - LS.me];
  me.wins = Math.max(me.wins, op.wins + 1); G.rs = 'RS_KO'; endMatch();
}
function lsRecv(p) {
  if (!LS.on || !p) return;
  for (let i = 0; i < p.b.length; i++) if (!LS.rem.has(p.f + i)) LS.rem.set(p.f + i, p.b[i]);
  while (LS.rem.has(LS.remTop + 1)) LS.remTop++;

function lsSend(force) {
  if (!ROOM.ch) return;

}
const lsHashOf = () => { let h = 2166136261; const mix = v => { h ^= Math.round(v * 16) | 0; h = Math.imul(h, 16777619); };
  for (const f of G.f) { mix(f.x); mix(f.y); mix(f.z); mix(f.hp); mix(f.grd); mix(f.brk); mix(f.wins); mix(f.state.length); mix(f.chain ? f.chain.hits * 1000 + f.chain.mom : -1); }
  mix(G.timer); mix(G.round); return h >>> 0; };
function lsHashCheck(f, h, remote) {
  if (remote) LS.remHash.set(f, h); else LS.hash.set(f, h);

  if (a != null && b != null) { LS.hash.delete(f); LS.remHash.delete(f); if (a !== b && !LS.desync) { LS.desync = true; console.warn('联机画面不同步 @', f); toast('联机同步出现偏差，本场结束后请重开一局'); } }
}
/* 每个渲染帧调用：凑齐双方输入才推进一帧 */
function lsTick(dt) {
  let n = 0;
  while (acc >= 1 && n < 6) {
    const tf = LS.frame + LS.D;
    if (!LS.loc.has(tf)) { LS.loc.set(tf, encIn(Input.read('P1'))); Input.endFrame(); }
    if (!LS.rem.has(LS.frame)) break;
    const a = LS.loc.get(LS.frame), r = LS.rem.get(LS.frame);
    const ins = LS.me === 0 ? [a, r] : [r, a];
    G.frame++; simStep(decIn(ins[0]), decIn(ins[1]));
    if (!LS.on) return;
    if (LS.frame % 60 === 0) { const h = lsHashOf(); lsHashCheck(LS.frame, h, false); roomSend('hash', { f: LS.frame, h }); }
    if (LS.frame - 90 < LS.ack) LS.loc.delete(LS.frame - 90); LS.rem.delete(LS.frame - 90);
    LS.frame++; acc -= 1; n++; LS.wait = 0;
  }
  if (n === 0 && acc >= 1) { LS.wait += dt; if (LS.wait > 20000) { roomSend('timeout'); toast('对手长时间没有响应，本场判你获胜'); lsForfeit(); return; } }
  if (acc > 6) acc = 6;
  lsSend(false);
}
/* 对战画面：标出自己、显示等待和延迟 */
function lsHUD(c) {
  if (!LS.on || G.f.length < 2) return;
  const f = G.f[LS.me], t = G.camT, x = (f.x - t.cx) * t.z + W / 2, y = (f.y - 250 * f.ch.scale - t.fy) * t.z + t.fy - t.ly;
  c.save(); c.fillStyle = f.col; c.beginPath(); c.moveTo(x - 9, y - 12); c.lineTo(x + 9, y - 12); c.lineTo(x, y); c.closePath(); c.fill();
  c.font = `700 18px ${FU}`; c.textAlign = 'center'; c.fillStyle = BONE; otxt(c, '你', x, y - 20); c.restore();
  if (LS.wait > 400) { c.save(); c.fillStyle = 'rgba(10,8,7,.55)'; c.fillRect(0, H / 2 - 40, W, 80); c.font = `700 26px ${FU}`; c.textAlign = 'center'; c.fillStyle = BONE; c.fillText(`等待对手… ${Math.ceil(LS.wait / 1000)} 秒`, W / 2, H / 2 + 9); c.restore(); }
}

/* ---------- 联机大厅界面 ---------- */
function buildOnline() {
  const B = $('#onBody'), sub = $('#onSub'); if (!B) return;
  if (ACC.state !== 'in') {
    sub.textContent = '';
    B.innerHTML = ACC.state === 'off' ? '<p>联机需要账户服务，作者还没开通。</p>' : `<p>联机对战需要先登录账户，对手会看到你的昵称、头像和称号。</p><div class="actions" style="justify-content:flex-start"><button class="btn primary" data-go="PG_ACCOUNT">去登录 / 注册</button></div>`;
    return;
  }
  lobbyJoin();
  sub.textContent = '和在线玩家实时对战，或者找好友切磋';
  const q = NET.status === 'queue', nIn = frIncoming().length, keep = ($('#frName') || {}).value || '';
  const tabs = `<div class="tabs ontabs"><button data-ontab="lobby" aria-selected="${NET.tab === 'lobby'}">在线大厅</button><button data-ontab="friends" aria-selected="${NET.tab === 'friends'}">好友${nIn ? ` <em class="badge">${nIn}</em>` : ''}</button></div>`;
  if (NET.tab === 'friends') { B.innerHTML = tabs + frHTML(); const i = $('#frName'); if (i && keep) i.value = keep; return; }
  B.innerHTML = tabs + `<div class="onact">
    <button class="btn primary" id="onQuick">${q ? '取消匹配' : '快速匹配'}</button>
    <button class="btn" id="onCreate"${q ? ' disabled' : ''}>创建房间</button>
    <span class="join"><input id="onCode" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4 位房间号"><button class="btn" id="onJoin"${q ? ' disabled' : ''}>加入房间</button></span>
  </div>
  <p class="hint" id="onState">${q ? '正在找对手…有其他人点「快速匹配」就会自动配对' : '创建房间后把房间号发给好友，或者直接邀请下面的在线玩家。'}</p>
  <h3>在线玩家 <small class="mute" id="onCount"></small></h3><div class="plist" id="onList"></div>`;
  renderPlayers();
}
function renderPlayers() {
  const L = $('#onList'); if (!L) return;
  const me = ACC.user.id, ms = NET.members.slice().sort((a, b) => (a.uid === me ? -1 : b.uid === me ? 1 : (b.wins || 0) - (a.wins || 0)));
  $('#onCount') && ($('#onCount').textContent = ms.length ? `${ms.length} 人` : '');
  const ST = { idle: '空闲', queue: '匹配中', room: '对战中' };
  L.innerHTML = ms.length ? ms.map(m => `<div class="prow">${avHTML(m.avatar)}<div><b>${esc(m.nick)}</b>${m.title ? `<span class="ptitle">${esc(m.title)}</span>` : ''}<small>联机 ${m.wins || 0} 胜 / ${m.games || 0} 场 · ${ST[m.status] || ''}</small></div>
    ${m.uid === me ? '<span class="mute">你</span>' : `<button class="btn" data-inv="${esc(m.uid)}"${m.status === 'room' ? ' disabled' : ''}>邀请</button>`}</div>`).join('') : '<p class="hint">正在连接大厅…</p>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'onQuick') { lobbySetStatus(NET.status === 'queue' ? 'idle' : 'queue'); return; }
  if (b.id === 'onCreate') { roomJoin(String(1000 + Math.floor(Math.random() * 9000)), true); return; }
  if (b.id === 'onJoin') { const c = ($('#onCode').value || '').trim(); if (!/^\d{4}$/.test(c)) { toast('请输入 4 位数字房间号'); return; } roomJoin(c, false); return; }
  if (b.dataset.inv) {
    const to = NET.members.find(m => m.uid === b.dataset.inv); if (!to) return;
    const code = String(1000 + Math.floor(Math.random() * 9000));
    roomJoin(code, true).then(ok => { if (ok) { NET.pending = to.uid; lobbySend('invite', { to: to.uid, from: myInfo(), room: code }); toast(`已邀请 ${to.nick}，等待对方接受`); } });
    return;
  }
  if (b.id === 'invYes') { const p = NET.invite; hideInvite(); if (p) { if (NET.status === 'queue') NET.status = 'idle'; lobbySend('reply', { to: p.from.uid, ok: true }); roomJoin(p.room, false, !!p.spar); } return; }
  if (b.id === 'invNo') { const p = NET.invite; hideInvite(); if (p) lobbySend('reply', { to: p.from.uid, ok: false }); return; }
  if (b.id === 'onBack') { go('PG_TITLE'); return; }
  if (b.id === 'quitNo') { modalClose(); return; }
  if (b.id === 'quitYes') { modalClose(); lsQuit(); return; }
});
/* ---------- 好友：加好友、好友列表（在线状态）、邀请切磋、加入好友的房间 ----------
   好友关系存在 friendships 表（见 supabase_setup.sql）；在线状态来自大厅 presence。
   好友切磋（ROOM.spar）不计战绩，房主可以选一局定胜负 / 三局两胜 / 五局三胜。 */
NET.fr = { rows: [], prof: {}, loaded: false, busy: false };
NET.tab = 'lobby';
async function frLoad() {
  if (ACC.state !== 'in' || !ACC.sb) return;
  const uid = ACC.user.id;
  try {
    const { data, error } = await ACC.sb.from('friendships').select('*'); if (error) throw error;
    const rows = (data || []).filter(r => r.requester === uid || r.addressee === uid);
    const ids = [...new Set(rows.map(r => r.requester === uid ? r.addressee : r.requester))];
    if (ids.length) { const p = await ACC.sb.from('profiles').select('id,username,nickname,avatar,title').in('id', ids); if (!p.error) for (const x of p.data || []) NET.fr.prof[x.id] = x; }
    NET.fr.rows = rows; NET.fr.loaded = true; NET.fr.err = '';
  } catch (e) { NET.fr.err = errCN(e); NET.fr.loaded = true; }
  frBadge(); if (G.page === 'PG_ONLINE') buildOnline();
}
const frOther = r => r.requester === ACC.user.id ? r.addressee : r.requester;
const frFriends = () => NET.fr.rows.filter(r => r.status === 'accepted');
const frIncoming = () => NET.fr.rows.filter(r => r.status === 'pending' && r.addressee === ACC.user.id);
const frOutgoing = () => NET.fr.rows.filter(r => r.status === 'pending' && r.requester === ACC.user.id);
const frIsFriend = uid => frFriends().some(r => frOther(r) === uid);
function frBadge() { const n = ACC.state === 'in' ? frIncoming().length : 0; const b = $('#frBadge'); if (b) { b.textContent = n; b.hidden = !n; } }
async function frAdd(name) {
  const u = String(name || '').trim().toLowerCase();
  if (!UNAME.test(u)) { toast('账号名是 3–16 位小写字母、数字或下划线'); return; }
  if (u === (ACC.profile || {}).username) { toast('不能加自己为好友'); return; }
  if (NET.fr.busy) return; NET.fr.busy = true;
  try {
    const { data: p, error } = await ACC.sb.from('profiles').select('id,username,nickname,avatar,title').eq('username', u).maybeSingle(); if (error) throw error;
    if (!p) { toast(`没有找到账号「${u}」`); return; }
    NET.fr.prof[p.id] = p;
    const ex = NET.fr.rows.find(r => frOther(r) === p.id);
    if (ex && ex.status === 'accepted') { toast(`${p.nickname} 已经是你的好友了`); return; }
    if (ex && ex.addressee === ACC.user.id) { await frAccept(ex.id); return; }
    if (ex) { toast('已经发过请求了，等对方同意'); return; }
    const r = await ACC.sb.from('friendships').insert({ requester: ACC.user.id, addressee: p.id }).select().single(); if (r.error) throw r.error;
    lobbySend('fr', { to: p.id, from: myInfo() }); toast(`已向 ${p.nickname} 发送好友请求`); const i = $('#frName'); if (i) i.value = ''; await frLoad();
  } catch (e) { toast('加好友失败：' + errCN(e)); } finally { NET.fr.busy = false; }
}
async function frAccept(id) {
  const r = NET.fr.rows.find(x => x.id === id); if (!r) return;
  try { const { error } = await ACC.sb.from('friendships').update({ status: 'accepted' }).eq('id', id); if (error) throw error; lobbySend('fra', { to: r.requester, from: myInfo() }); const p = NET.fr.prof[r.requester]; toast(`已和 ${p ? p.nickname : '对方'} 成为好友`); await frLoad(); }
  catch (e) { toast('操作失败：' + errCN(e)); }
}
async function frRemove(id, quiet) {
  const r = NET.fr.rows.find(x => x.id === id);
  try { const { error } = await ACC.sb.from('friendships').delete().eq('id', id); if (error) throw error; if (r) lobbySend('frd', { to: frOther(r) }); if (!quiet) toast('已删除'); await frLoad(); }
  catch (e) { toast('操作失败：' + errCN(e)); }
}
function frOnStatus(uid) {
  const m = NET.members.find(x => x.uid === uid); if (!m) return { on: false, t: '离线' };
  if (m.status === 'room' && m.room && m.open) return { on: true, m, t: m.spar ? '在切磋房间里等人' : '在房间里等人', join: m.room };
  return { on: true, m, t: { idle: '在线', queue: '匹配中', room: '对战中' }[m.status] || '在线' };
}
/* 邀请好友切磋：已经在自己开的空房间里就直接邀请，否则先开一个切磋房间 */
function frInvite(uid) {
  const to = NET.members.find(m => m.uid === uid); if (!to) { toast('对方不在线'); return; }
  const send = code => { NET.pending = uid; lobbySend('invite', { to: uid, from: myInfo(), room: code, spar: true }); toast(`已邀请 ${to.nick} 切磋，等待对方接受`); };
  if (ROOM.ch && ROOM.host && !ROOM.peer) { send(ROOM.code); return; }
  const code = String(1000 + Math.floor(Math.random() * 9000));
  roomJoin(code, true, true).then(ok => { if (ok) send(code); });
}
function frHTML() {
  if (!NET.fr.loaded) { frLoad(); return '<p class="hint">正在读取好友…</p>'; }
  const prof = id => NET.fr.prof[id] || { nickname: '？', avatar: 'CH_JIN', username: '' };
  const row = (id, right, sub) => { const p = prof(id); return `<div class="prow">${avHTML(p.avatar)}<div><b>${esc(p.nickname)}</b>${p.title ? `<span class="ptitle">${esc(p.title)}</span>` : ''}<small>@${esc(p.username)}${sub ? ' · ' + sub : ''}</small></div><span class="pbtns">${right}</span></div>`; };
  const inc = frIncoming(), out = frOutgoing(), fr = frFriends().map(r => ({ r, id: frOther(r), s: frOnStatus(frOther(r)) })).sort((a, b) => (b.s.on - a.s.on) || (prof(a.id).nickname < prof(b.id).nickname ? -1 : 1));
  const busyMe = NET.status === 'room' && !(ROOM.host && !ROOM.peer);
  return `<div class="onact"><span class="join"><input id="frName" maxlength="16" placeholder="对方的账号名" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="btn" id="frAddBtn">加好友</button></span>
    <button class="btn primary" id="frRoom"${busyMe ? ' disabled' : ''}>${ROOM.ch && ROOM.spar && ROOM.host ? '回到切磋房间' : '开切磋房间'}</button></div>
    <p class="hint">好友切磋不计战绩，房主可以选一局定胜负、三局两胜或五局三胜。你的账号名是 <b>${esc((ACC.profile || {}).username || '')}</b>，发给朋友让对方加你。</p>
    ${NET.fr.err ? `<p class="hint err">好友读取失败：${esc(NET.fr.err)}</p>` : ''}
    ${inc.length ? `<h3>好友请求</h3><div class="plist fr">${inc.map(r => row(r.requester, `<button class="btn" data-frno="${r.id}">拒绝</button><button class="btn primary" data-frok="${r.id}">同意</button>`, '想加你为好友')).join('')}</div>` : ''}
    <h3>我的好友 <small class="mute">${fr.length ? `${fr.filter(x => x.s.on).length} / ${fr.length} 在线` : ''}</small></h3>
    <div class="plist fr">${fr.length ? fr.map(({ r, id, s }) => row(id,
      (s.join ? `<button class="btn primary" data-frjoin="${esc(s.join)}"${busyMe ? ' disabled' : ''}>加入</button>` : s.on && s.m.status !== 'room' ? `<button class="btn primary" data-frinv="${esc(id)}"${busyMe ? ' disabled' : ''}>邀请切磋</button>` : '') + `<button class="btn ghost" data-frdel="${r.id}" title="删除好友">删除</button>`,
      `<i class="dot${s.on ? ' on' : ''}"></i>${s.t}`)).join('') : '<p class="hint">还没有好友。输入对方的账号名就能加。</p>'}</div>
    ${out.length ? `<h3>等待对方同意</h3><div class="plist">${out.map(r => row(r.addressee, `<button class="btn ghost" data-frdel="${r.id}">撤回</button>`, '已发送请求')).join('')}</div>` : ''}`;
}
/* 房间里等对手时：列出在线好友，一键邀请 */
function frRoomInviteHTML() {

  const on = frFriends().map(r => frOther(r)).map(id => ({ id, s: frOnStatus(id), p: NET.fr.prof[id] })).filter(x => x.s.on && x.s.m.status !== 'room' && x.p);

function roundsHTML() {
  const opts = [[1, '一局定胜负'], [2, '三局两胜'], [3, '五局三胜']];
  return opts.map(([v, n]) => `<button class="chip" data-rounds="${v}" aria-pressed="${ROOM.rounds === v}"${ROOM.host ? '' : ' disabled'}>${n}</button>`).join('');
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;

});
